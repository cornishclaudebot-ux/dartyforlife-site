<!-- Tempe intro. TRUE full bleed: the artwork runs edge to edge with no frame,
     no radius and no shadow, and the nav floats over its dark top strip the
     same way it does over the video on the home page.
     The art is 16:9 with the wordmark spanning the full width, so it is NEVER
     cropped — cropping sideways cuts the wordmark, and cropping vertically is
     the only safe axis. Leftover height is filled with the artwork's own edge
     colour (#110002, sampled from its left/right/top edges) so no letterbox
     is visible. The bottom edge is lighter, where the subject is cut off, so
     a short gradient dissolves him into the page instead of guillotining him. -->
<section class="tempe-intro">
  <!-- the artwork carries the wordmark, so it IS the title, exactly as the
       neon sign is the title on the Darty Bars page -->
  <h1 class="sr-only">DartyForLife Tempe</h1>
  <picture class="tempe-art">
    <source media="(max-width:700px)" srcset="media/brand/tempe-intro-900.jpg?v=2" />
    <img src="media/brand/tempe-intro.jpg?v=2" width="1672" height="941" fetchpriority="high"
         alt="DartyForLife Tempe: a partygoer covered in gold paint in front of a crowd" />
  </picture>
  <div class="tempe-intro-copy">
    <p class="sec-sub">The college side of Darty. Every Thursday at The Rack in Old Town Scottsdale. Ages 21 &amp; over.</p>
  </div>
</section>

<div class="marquee"><div class="marquee-track" id="mq1"></div></div>

</section>

name: Site sentinel (cloud-side)

# The Mac (residential IP) is the primary Posh puller — Posh's Cloudflare
# 403s ALL datacenter IPs (GitHub + Vercel tested 2026-07-24), so the cloud
# cannot pull. What the cloud CAN do reliably:
#   1. watch the live site's pipeline heartbeat and EMAIL the owner if the
#      Mac-side updater has been dead for >30h (alerting must not live on
#      the machine whose death it reports)
#   2. opportunistically try the Posh pull anyway — if Posh ever unblocks
#      datacenter IPs this workflow silently becomes a second updater
on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Force the stale-alert email path (subject marked TEST)"
        required: false
        default: "no"

permissions:
  contents: write

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Heartbeat check + stale alert
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          read_hb() { curl -s -m 20 "https://dartyforlife.com/heartbeat.txt" || true; }
          check() { python3 -c "
          import sys, datetime
          hb = sys.argv[1].strip()
          try:
              t = datetime.datetime.fromisoformat(hb.replace('Z', '+00:00'))
              age_h = (datetime.datetime.now(datetime.timezone.utc) - t).total_seconds() / 3600
              print(f'heartbeat age: {age_h:.1f}h', file=sys.stderr)
              sys.exit(0 if age_h <= 30 else 1)
          except Exception as e:
              print('heartbeat unreadable:', e, file=sys.stderr)
              sys.exit(1)" "$1"; }
          if [ "${{ github.event.inputs.test_alert }}" = "yes" ]; then
            echo "TEST MODE: proving the alert path from this runner"
            resp=$(curl -s -w "\n%{http_code}" -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" \
              -d '{"from":"DartyForLife Cloud Sentinel <rentals@apexaz.ai>","to":["dartyforlife@gmail.com"],"subject":"TEST: cloud sentinel alert path works (ignore)","text":"This is a one-time test proving the cloud sentinel can email you from GitHub if the Mac updater ever dies. No action needed."}')
            code=$(echo "$resp" | tail -1)
            echo "resend status: $code"; echo "resend body: $(echo "$resp" | sed '$d' | head -c 300)"
            [ "$code" = "200" ] || exit 1
            exit 0
          fi
          hb=$(read_hb)
          if ! check "$hb"; then
            # a mid-deploy read can race a fresh push - re-check after 90s
            echo "first read looked stale/unreadable, retrying in 90s"
            sleep 90
            hb=$(read_hb)
            if check "$hb"; then echo "recovered on retry - all good"; exit 0; fi
            echo "STALE confirmed - alerting owner"
            resp=$(curl -s -w "\n%{http_code}" -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" \
              -d '{"from":"DartyForLife Cloud Sentinel <rentals@apexaz.ai>","to":["dartyforlife@gmail.com"],"subject":"DFL site updates are STALE (Mac updater down)","text":"dartyforlife.com data heartbeat is over 30 hours old.\n\nThe Mac that pulls from Posh has probably been asleep or offline. Open it, plug it in, and the updater self-heals within 5 minutes.\n\nThe site itself is still up, serving the last good data."}')
            code=$(echo "$resp" | tail -1)
            echo "resend status: $code"
            echo "resend body: $(echo "$resp" | sed '$d' | head -c 300)"
            [ "$code" = "200" ] || exit 1
          else
            echo "heartbeat healthy"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Opportunistic Posh pull (silent on the expected 403)
        run: |
          if node scripts/update-events.mjs; then
            if ! git diff --quiet events.json scripts/geocache.json counts.json 2>/dev/null; then
              git config user.name "dartyforlife-events-bot"
              git config user.email "actions@users.noreply.github.com"
              git add events.json scripts/geocache.json counts.json
              git commit -m "Auto-update events from Posh (cloud pull)"
              git push
            fi
            echo "cloud pull WORKED - Posh unblocked datacenter IPs"
          else
            echo "cloud pull blocked as expected (Posh 403s datacenter IPs) - not a failure"
          fi
